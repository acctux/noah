devices: ({
  name: "MX Master 3S";
  smartshift: {
    on: true;
    threshold: 15;
  };
  hiresscroll: {
    hires: true;
    invert: false;
    target: false;
  };
  dpi: 5200;
  buttons: (
    // Forward button
    {
      cid: 0x56;
      action: {
        type: "Gestures";
        gestures: (
          {
            direction: "None";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTCTRL", "KEY_V" ];
            }
          },
          {
            direction: "Up";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_SPACE" ];
            }
          },
          {
            direction: "Down";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_B" ];
            }
          },
          {
            direction: "Right";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_T" ];
            }
          },
          {
            direction: "Left";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_E" ];
            }
          }
        );
      };
    },
    // Back button
    {
      cid: 0x53;
      action: {
        type: "Gestures";
        gestures: (
          {
            direction: "None";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTCTRL", "KEY_C" ];
            }
          },
          {
            direction: "Right";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_G" ];
            }
          },
          {
            direction: "Left";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_D" ];
            }
          },
          {
            direction: "Up";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_F" ];
            }
          },
          {
            direction: "Down";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_ESC" ];
            }
          }
        );
      };
    },
    // Gesture button (hold and move)
    {
      cid: 0xc3;
      action: {
        type: "Gestures";
        gestures: (
          {
            direction: "None";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_R" ];
            }
          },
          {
            direction: "Right";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_K" ];
            }
          },
          {
            direction: "Left";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_J" ];
            }
          },
          {
            direction: "Up";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_H" ];
            }
          },
          {
            direction: "Down";
            mode: "OnRelease";
            action: {
              type: "Keypress";
              keys: [ "KEY_LEFTMETA", "KEY_L" ];
            }
          }
        );
      };
    },
    // Top button
    {
      cid: 0xc4;
      action: {
        type: "Keypress";
        keys: [ "KEY_LEFTSHIFT" ];
      };
    }
  );
});
